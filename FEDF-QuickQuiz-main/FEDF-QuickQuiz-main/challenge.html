<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Challenge - QuickQuiz</title><link rel="stylesheet" href="feature.css"></head><body>
<nav class="feature-nav"><a href="dashboard.html">Dashboard</a><a href="insights.html">Smart Insights</a><a href="saved.html">Saved Questions</a><a class="active" href="challenge.html">Daily Challenge</a><a href="review.html">Quiz Review</a><a href="leaderboard.html">Leaderboard</a></nav>
<main class="feature-main"><section class="feature-card"><h1>Daily Challenge</h1><div data-state class="state">Loading today's challenge...</div><div id="challengeMeta" class="summary-grid"></div><div id="timer" class="muted"></div><button id="start" type="button" hidden>Start Challenge</button><form id="form" class="feature-list" hidden></form><div id="history"></div></section></main>
<script src="feature-common.js"></script><script>
const state=document.querySelector('[data-state]'),form=document.getElementById('form'),timer=document.getElementById('timer'),start=document.getElementById('start'),meta=document.getElementById('challengeMeta'),historyBox=document.getElementById('history');let challenge,seconds=300,interval;
function renderHistory(data){historyBox.innerHTML=data.history.length?`<h2>Challenge history · ${data.streak} day streak</h2>`+data.history.slice(0,7).map(a=>`<article class="feature-item">${a.dateKey}: ${a.score}/${a.total} · ${a.points} XP</article>`).join(''):''}
async function load(){if(!featureAuth.requireAuth())return;state.className='state';state.textContent="Loading today's challenge...";form.hidden=true;start.hidden=true;timer.textContent='';try{challenge=await featureAuth.fetchJson('/api/daily-challenge');const history=await featureAuth.fetchJson('/api/daily-challenge/history');renderHistory(history);if(challenge.completed){state.className='state success';state.textContent=`Completed today: ${challenge.attempt.score}/${challenge.attempt.total} (${challenge.attempt.points} points)`;return}if(challenge.questions.length!==5){state.textContent='The daily challenge needs five questions and is not available yet.';return}meta.innerHTML='<article class="feature-item"><strong>5</strong><span class="muted">Questions</span></article><article class="feature-item"><strong>5 min</strong><span class="muted">Time limit</span></article>';state.textContent='Ready when you are.';start.hidden=false}catch(e){featureAuth.showError(e.message,load)}}
function begin(){start.hidden=true;form.hidden=false;state.textContent='Answer all five questions, then submit once.';form.innerHTML=challenge.questions.map((q,i)=>`<article class="feature-item"><b>${i+1}. ${q.question}</b>${(q.options||[]).map(o=>`<label class="option"><input required type="radio" name="q${i}" value="${o}"> ${o}</label>`).join('')}</article>`).join('')+'<button type="submit">Submit challenge</button>';seconds=300;timer.textContent='Time remaining: 5:00';interval=setInterval(()=>{seconds--;timer.textContent=`Time remaining: ${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`;if(seconds<=0){clearInterval(interval);submit(new Event('submit'))}},1000);form.addEventListener('submit',submit,{once:true})}
async function submit(e){e.preventDefault();clearInterval(interval);if(!confirm('Submit your challenge now?')){interval=setInterval(()=>{seconds--;timer.textContent=`Time remaining: ${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`;if(seconds<=0){clearInterval(interval);form.requestSubmit()}},1000);return}const answers=challenge.questions.map((_,i)=>new FormData(form).get('q'+i)||'');try{const result=await featureAuth.fetchJson('/api/daily-challenge/attempts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({questionIds:challenge.questions.map(q=>q.questionId),answers})});state.className='state success';state.textContent=`Challenge complete: ${result.score}/${result.total} · ${result.points} points`;form.hidden=true;timer.textContent='';await load()}catch(e){featureAuth.showError(e.message,load)}}
start.addEventListener('click',begin);load();
</script></body></html>
