<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Insights - QuickQuiz</title><link rel="stylesheet" href="feature.css"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script></head><body>
<nav class="feature-nav"><a href="dashboard.html">Dashboard</a><a class="active" href="insights.html">Smart Insights</a><a href="saved.html">Saved Questions</a><a href="challenge.html">Daily Challenge</a><a href="review.html">Quiz Review</a><a href="leaderboard.html">Leaderboard</a></nav>
<main class="feature-main"><section class="feature-card"><h1>Smart Insights</h1><div id="filters" class="filters"><label>Course <select id="course"><option value="">All Courses</option></select></label><label>Period <select id="range"><option value="all">All Time</option><option value="7">Last 7 days</option><option value="30">Last 30 days</option><option value="90">Last 90 days</option></select></label></div><div data-state class="state">Loading your analytics...</div><div id="content" hidden><div id="summary" class="summary-grid"></div><div id="progress" class="progress-panel"></div><div id="charts" class="chart-grid"><div id="topicCard"><h2>Topic Accuracy</h2><canvas id="topicChart"></canvas></div><div><h2>Accuracy Overview</h2><canvas id="accuracyChart"></canvas></div><div><h2>Performance Trend</h2><canvas id="trendChart"></canvas></div></div><div id="topicState" class="state" hidden></div><h2>Topic Analysis</h2><div id="topics" class="feature-list"></div><h2>Recommendations</h2><div id="recommendations" class="feature-list"></div><div class="action-row"><a class="button" href="quizz.html">Practice Weak Topics</a><a class="button" href="review.html">View Quiz History</a><a class="button" href="courses.html">Explore Related Courses</a></div></div></section></main>
<script src="feature-common.js"></script><script>
const state=document.querySelector('[data-state]'),content=document.getElementById('content'),summary=document.getElementById('summary'),progress=document.getElementById('progress'),topics=document.getElementById('topics'),recommendations=document.getElementById('recommendations'),topicState=document.getElementById('topicState'),course=document.getElementById('course'),range=document.getElementById('range');let charts={};
function metric(label,value){return `<article class="feature-item"><strong>${value}</strong><span class="muted">${label}</span></article>`}
function destroyCharts(){Object.values(charts).forEach(chart=>chart.destroy());charts={}}
function chart(id,type,labels,data,label,options={}){const canvas=document.getElementById(id);charts[id]=new Chart(canvas,{type,data:{labels,datasets:[{label,data,backgroundColor:options.colors||'#4f46e5',borderColor:'#4f46e5',borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,indexAxis:options.horizontal?'y':'x',plugins:{legend:{display:type==='doughnut'},tooltip:{callbacks:{label:context=>`${context.dataset.label}: ${context.parsed.y ?? context.parsed}%`}}},scales:type==='doughnut'?{}:{x:{beginAtZero:true,max:options.horizontal?100:undefined}}}})}
function render(data){content.hidden=false;state.hidden=true;summary.innerHTML=metric('Quizzes completed',data.summary.totalQuizzes)+metric('Average quiz score',`${data.summary.averageScore}%`)+metric('Overall accuracy',`${data.summary.overallAccuracy}%`)+metric('Highest quiz score',`${data.summary.highestScore}%`)+metric('Questions answered',data.summary.totalQuestions)+metric('Correct answers',data.summary.correctAnswers);progress.innerHTML=`<strong>Learning progress</strong><span>Last 7 days: ${data.summary.weeklyQuizzes} quizzes</span><span>Last 30 days: ${data.summary.monthlyQuizzes} quizzes</span><span>Score improvement: ${data.summary.scoreImprovement===null?'First recorded attempt':`${data.summary.scoreImprovement>=0?'+':''}${data.summary.scoreImprovement} points`}</span><span>Consistency: ${data.summary.consistency}%</span>`;destroyCharts();const rows=data.topics;document.getElementById('charts').hidden=false;chart('accuracyChart','doughnut',['Correct','Incorrect'],[data.summary.correctAnswers,data.summary.incorrectAnswers],'Answers',{colors:['#16a34a','#dc2626']});chart('trendChart','line',data.trend.map(i=>new Date(i.date).toLocaleDateString()),data.trend.map(i=>i.score),'Score %');if(rows.length){document.getElementById('topicCard').hidden=false;chart('topicChart','bar',rows.map(i=>i.topic),rows.map(i=>i.accuracy),'Accuracy %',{horizontal:true});topicState.hidden=true}else{document.getElementById('topicCard').hidden=true;topicState.hidden=false;topicState.textContent='Topic-level analysis is unavailable because your completed attempts do not contain topic metadata.'}topics.innerHTML=rows.map(i=>`<article class="feature-item ${i.category.toLowerCase()}"><b>${i.topic}</b><p>${i.total} attempted · ${i.correct} correct · ${i.incorrect} incorrect · ${i.accuracy}% accuracy</p><a class="button" href="${i.practiceHref}">Practice ${i.topic}</a></article>`).join('');recommendations.innerHTML=data.recommendations.length?data.recommendations.map(i=>`<article class="feature-item"><p>${i.text}</p><a class="button" href="${i.href}">Open</a></article>`).join(''):'<div class="state">Keep completing quizzes to receive personalized recommendations.</div>'}
async function load(){if(!featureAuth.requireAuth())return;state.hidden=false;state.className='state';state.textContent='Loading your analytics...';content.hidden=true;try{const params=new URLSearchParams();if(course.value)params.set('course',course.value);params.set('range',range.value);const data=await featureAuth.fetchJson('/api/analytics/smart-insights?'+params);if(!course.options.length||course.options.length===1){course.innerHTML='<option value="">All Courses</option>'+data.availableCourses.map(value=>`<option value="${value}">${value}</option>`).join('')}if(!data.hasData){state.innerHTML=`<div class="empty-icon">📊</div><h2>You haven't completed any quizzes yet.</h2><p>Complete a quiz to unlock topic accuracy, progress trends, and personalized recommendations.</p><a class="button" href="quizz.html">Start Your First Quiz</a>`;return}render(data)}catch(error){featureAuth.showError(error.message,load)}}
course.addEventListener('change',load);range.addEventListener('change',load);load();
</script></body></html>
