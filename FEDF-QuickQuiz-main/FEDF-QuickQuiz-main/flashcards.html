<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flashcards - QuickQuiz</title><link rel="stylesheet" href="feature.css"><link rel="stylesheet" href="learning.css"></head><body><nav class="feature-nav"><a href="dashboard.html">Dashboard</a><a href="insights.html">Smart Insights</a><a href="planner.html">Study Planner</a><a class="active" href="flashcards.html">Flashcards</a><a href="mock-exams.html">Mock Exams</a><a href="forum.html">Discussion Forum</a><a href="certificates.html">Certificates</a><a href="saved.html">Saved Questions</a><a href="challenge.html">Daily Challenge</a><a href="review.html">Quiz Review</a><a href="leaderboard.html">Leaderboard</a></nav><main class="feature-main"><section class="feature-card"><h1>Interactive Flashcards</h1><form id="form" class="learning-form"><input name="course" placeholder="Course" required><input name="topic" placeholder="Topic"><input name="question" placeholder="Question" required><textarea name="answer" placeholder="Answer" required></textarea><select name="difficulty"><option>Easy</option><option selected>Medium</option><option>Hard</option></select><button>Create flashcard</button></form><div data-state class="state">Loading...</div><div id="list" class="learning-grid"></div></section></main><script src="feature-common.js"></script><script>
const form=document.querySelector('#form'),state=document.querySelector('[data-state]'),list=document.querySelector('#list');async function load(){try{const data=await featureAuth.fetchJson('/api/flashcards/due');state.hidden=true;list.innerHTML=data.length?data.map(x=>`<article class="feature-item"><div class="flip-card" data-card="${x.id||x._id}"><span class="question"><b>${x.question}</b><br><small>Click to reveal</small></span><span class="answer">${x.answer}</span></div><p>${x.course} · ${x.topic||'General'} · ${x.difficulty}</p><div class="toolbar"><button data-review="${x.id||x._id}" data-remembered="true">Remembered</button><button data-review="${x.id||x._id}" data-remembered="false">Review again</button><button class="danger" data-delete="${x.id||x._id}">Delete</button></div></article>`).join(''):'<div class="state">No flashcards due for review. Create one above.</div>'}catch(e){featureAuth.showError(e.message,load)}}form.addEventListener('submit',async e=>{e.preventDefault();try{await featureAuth.fetchJson('/api/flashcards',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});form.reset();load()}catch(e){featureAuth.showError(e.message,load)}});list.addEventListener('click',async e=>{const card=e.target.closest('.flip-card');if(card)card.classList.toggle('flipped');try{if(e.target.dataset.review)await featureAuth.fetchJson('/api/flashcards/'+e.target.dataset.review+'/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({remembered:e.target.dataset.remembered==='true'})});if(e.target.dataset.delete)await featureAuth.fetchJson('/api/flashcards/'+e.target.dataset.delete,{method:'DELETE'});load()}catch(err){featureAuth.showError(err.message,load)}});load();</script></body></html>
