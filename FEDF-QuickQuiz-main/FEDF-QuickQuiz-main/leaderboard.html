<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leaderboard - QuickQuiz</title><link rel="stylesheet" href="feature.css"></head><body>
<nav class="feature-nav"><a href="dashboard.html">Dashboard</a><a href="insights.html">Smart Insights</a><a href="saved.html">Saved Questions</a><a href="challenge.html">Daily Challenge</a><a href="review.html">Quiz Review</a><a class="active" href="leaderboard.html">Leaderboard</a></nav>
<main class="feature-main"><section class="feature-card"><h1>Leaderboard</h1><div class="filters"><button id="global" type="button">Global</button><button id="weekly" type="button">This week</button><select id="course"><option value="">Course leaderboard</option></select></div><div data-state class="state">Loading rankings...</div><ol id="items" class="feature-list"></ol></section></main>
<script src="feature-common.js"></script><script>
const state=document.querySelector('[data-state]'),items=document.getElementById('items'),course=document.getElementById('course');let data;
function render(rows,title){if(!rows.length){state.textContent='No students have entered the leaderboard yet. Complete a quiz to get started.';items.innerHTML='';return}state.textContent=title+(data.current?` · Your current rank: #${data.current.rank}`:'');items.innerHTML=rows.map(i=>`<li class="feature-item ${data.current&&data.current.user.id===i.user.id?'current':''}">#${i.rank} <b>${i.user.name}</b> · best ${i.score}% · ${i.xp} XP · ${i.attempts} quizzes</li>`).join('')}
async function load(){if(!featureAuth.requireAuth())return;state.textContent='Loading rankings...';items.innerHTML='';try{data=await featureAuth.fetchJson('/api/leaderboard');course.innerHTML='<option value="">Course leaderboard</option>'+data.courses.map(c=>`<option value="${c.course}">${c.course}</option>`).join('');render(data.leaderboard,'Global leaderboard')}catch(e){featureAuth.showError(e.message,load)}}
document.getElementById('global').addEventListener('click',()=>render(data.leaderboard,'Global leaderboard'));document.getElementById('weekly').addEventListener('click',async()=>{try{const weekly=await featureAuth.fetchJson('/api/leaderboard?period=weekly');render(weekly.leaderboard,'Weekly leaderboard')}catch(e){featureAuth.showError(e.message,load)}});course.addEventListener('change',()=>{const selected=data.courses.find(c=>c.course===course.value);render(selected?selected.leaderboard:data.leaderboard,selected?`${selected.course} leaderboard`:'Global leaderboard')});load();
</script></body></html>
