<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Certificates - QuickQuiz</title><link rel="stylesheet" href="feature.css"><link rel="stylesheet" href="learning.css"></head><body><nav class="feature-nav"><a href="dashboard.html">Dashboard</a><a href="insights.html">Smart Insights</a><a href="planner.html">Study Planner</a><a href="flashcards.html">Flashcards</a><a href="mock-exams.html">Mock Exams</a><a href="forum.html">Discussion Forum</a><a class="active" href="certificates.html">Certificates</a><a href="saved.html">Saved Questions</a><a href="challenge.html">Daily Challenge</a><a href="review.html">Quiz Review</a><a href="leaderboard.html">Leaderboard</a></nav><main class="feature-main"><section class="feature-card"><h1>Course Certificates</h1><p class="muted">Certificates require a real course quiz average of at least 70%.</p><form id="form" class="learning-form"><input name="course" placeholder="Course name" required><button>Check eligibility and issue certificate</button></form><div data-state class="state">Loading...</div><div id="list" class="learning-grid"></div></section></main><script src="feature-common.js"></script><script>
const state=document.querySelector('[data-state]'),form=document.querySelector('#form'),list=document.querySelector('#list');async function load(){try{const data=await featureAuth.fetchJson('/api/certificates');state.hidden=true;list.innerHTML=data.length?data.map(x=>`<article class="certificate"><h2>${x.course}</h2><p>Certificate ${x.certificateNumber}</p><p>Issued ${new Date(x.issuedAt).toLocaleDateString()}</p><a class="button" href="/api/certificates/${x.id||x._id}/pdf" target="_blank">Download PDF</a><a class="button" href="/api/certificates/verify/${x.certificateNumber}" target="_blank">Verify</a></article>`).join(''):'<div class="state">No certificates issued yet.</div>'}catch(e){featureAuth.showError(e.message,load)}}form.addEventListener('submit',async e=>{e.preventDefault();try{await featureAuth.fetchJson('/api/certificates',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});form.reset();load()}catch(e){alert(e.message)}});load();</script></body></html>
