<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz Review - QuickQuiz</title><link rel="stylesheet" href="feature.css"></head><body>
<nav class="feature-nav"><a href="dashboard.html">Dashboard</a><a href="insights.html">Smart Insights</a><a href="saved.html">Saved Questions</a><a href="challenge.html">Daily Challenge</a><a class="active" href="review.html">Quiz Review</a><a href="leaderboard.html">Leaderboard</a></nav>
<main class="feature-main"><section class="feature-card"><h1>Quiz Review</h1><div data-state class="state">Loading attempt history...</div><div id="items" class="feature-list"></div></section></main>
<script src="feature-common.js"></script><script>
const state=document.querySelector('[data-state]'),items=document.getElementById('items');
async function load(){if(!featureAuth.requireAuth())return;state.className='state';state.textContent='Loading attempt history...';items.innerHTML='';try{const data=await featureAuth.fetchJson('/api/dashboard');if(!data.attempts.length){state.textContent='No quiz attempts yet. Complete a quiz to review it.';return}state.textContent='Select an attempt to compare results.';items.innerHTML=data.attempts.slice().reverse().map(a=>`<article class="feature-item"><b>${a.course}</b><p>${a.score}/${a.total} · ${a.percent}% · ${new Date(a.createdAt).toLocaleString()}</p><a class="button" href="review.html?attempt=${encodeURIComponent(a.id||a._id)}">Open detailed review</a></article>`).join('');const id=new URLSearchParams(location.search).get('attempt');if(id)await showReview(id)}catch(e){featureAuth.showError(e.message,load)}}
async function showReview(id){const data=await featureAuth.fetchJson('/api/review/'+encodeURIComponent(id));state.textContent=`${data.attempt.course}: ${data.attempt.score}/${data.attempt.total} (${data.attempt.percent}%) · ${data.comparison?.direction||'first attempt'}`;items.innerHTML=`<p><button type="button" id="pdf">Download PDF report</button> <button type="button" id="retry">Retry incorrect questions</button></p>`+(data.comparison?`<p>Previous comparison: ${data.comparison.change>=0?'+':''}${data.comparison.change} percentage points.</p>`:'')+(data.attempt.answers||[]).map(a=>`<article class="feature-item ${a.correct?'strong':'weak'}"><b>${a.correct?'Correct':'Incorrect'}</b><p>${a.question||a.questionId}</p><p>Submitted: ${a.submitted||'Unanswered'} · Correct: ${a.correctAnswer||'Unavailable'}</p>${a.explanation?`<p class="muted">${a.explanation}</p>`:''}</article>`).join('');document.getElementById('pdf').addEventListener('click',()=>download(id));document.getElementById('retry').addEventListener('click',()=>retry(id))}
async function retry(id){try{const data=await featureAuth.fetchJson('/api/review/'+encodeURIComponent(id)+'/retry');sessionStorage.setItem('retryQuiz',JSON.stringify(data.questions));location.href='quizz.html?retry=1'}catch(e){featureAuth.showError(e.message,()=>showReview(id))}}
async function download(id){try{const response=await fetch('/api/review/'+encodeURIComponent(id)+'/pdf',{headers:featureAuth.headers});if(!response.ok)throw Error('Report could not be downloaded');const blob=await response.blob(),link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='quickquiz-report.pdf';link.click();URL.revokeObjectURL(link.href)}catch(e){featureAuth.showError(e.message,()=>showReview(id))}}
load();
</script></body></html>
