<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Planner - QuickQuiz</title><link rel="stylesheet" href="feature.css"><link rel="stylesheet" href="learning.css"></head><body><nav class="feature-nav"><a href="dashboard.html">Dashboard</a><a href="insights.html">Smart Insights</a><a class="active" href="planner.html">Study Planner</a><a href="flashcards.html">Flashcards</a><a href="mock-exams.html">Mock Exams</a><a href="forum.html">Discussion Forum</a><a href="certificates.html">Certificates</a><a href="saved.html">Saved Questions</a><a href="challenge.html">Daily Challenge</a><a href="review.html">Quiz Review</a><a href="leaderboard.html">Leaderboard</a></nav><main class="feature-main"><section class="feature-card"><h1>Study Planner</h1><p class="muted">Plan sessions around your real Smart Insights weak topics.</p><div data-state class="state">Loading...</div><form id="form" class="learning-form" hidden><input name="course" placeholder="Course" required><input name="topic" placeholder="Topic"><input name="task" placeholder="Study task" required><input name="scheduledDate" type="date" required><input name="duration" type="number" min="1" placeholder="Duration in minutes" required><input name="goal" placeholder="Learning goal"><button>Create study task</button></form><h2>Upcoming and completed tasks</h2><div id="list" class="feature-list"></div></section></main><script src="feature-common.js"></script><script>
const state=document.querySelector('[data-state]'),form=document.querySelector('#form'),list=document.querySelector('#list');async function load(){try{const data=await featureAuth.fetchJson('/api/study-plans');state.hidden=true;form.hidden=false;list.innerHTML=data.length?data.map(x=>`<article class="feature-item learning-item"><div><b>${x.task}</b><p>${x.course}${x.topic?` · ${x.topic}`:''} · ${x.duration} min · ${new Date(x.scheduledDate).toLocaleDateString()}</p><span class="small">${x.status}</span></div><div><button data-complete="${x.id}" ${x.status==='completed'?'disabled':''}>Complete</button><button class="danger" data-delete="${x.id}">Delete</button></div></article>`).join(''):'<div class="state">No study tasks yet. Create your first plan.</div>'}catch(e){featureAuth.showError(e.message,load)}}form.addEventListener('submit',async e=>{e.preventDefault();try{await featureAuth.fetchJson('/api/study-plans',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});form.reset();load()}catch(e){featureAuth.showError(e.message,load)}});list.addEventListener('click',async e=>{const complete=e.target.dataset.complete,del=e.target.dataset.delete;try{if(complete)await featureAuth.fetchJson('/api/study-plans/'+complete,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'completed'})});if(del)await featureAuth.fetchJson('/api/study-plans/'+del,{method:'DELETE'});load()}catch(err){featureAuth.showError(err.message,load)}});load();</script></body></html>
