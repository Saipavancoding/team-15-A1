<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mock Exams - QuickQuiz</title><link rel="stylesheet" href="feature.css"><link rel="stylesheet" href="learning.css"></head>
<body>
<nav class="feature-nav"><a href="dashboard.html">Dashboard</a><a href="insights.html">Smart Insights</a><a href="planner.html">Study Planner</a><a href="flashcards.html">Flashcards</a><a class="active" href="mock-exams.html">Mock Exams</a><a href="forum.html">Discussion Forum</a><a href="certificates.html">Certificates</a><a href="saved.html">Saved Questions</a><a href="challenge.html">Daily Challenge</a><a href="review.html">Quiz Review</a><a href="leaderboard.html">Leaderboard</a></nav>
<main class="feature-main"><section class="feature-card"><h1>Mock Examinations</h1><p class="muted">Published examinations use the existing question bank and allow one verified submission.</p>
<form id="teacherForm" class="learning-form" hidden><h2>Create examination</h2><input name="title" placeholder="Exam title" required><input name="course" placeholder="Course" required><input name="durationMinutes" type="number" min="1" placeholder="Duration in minutes" required><input name="totalMarks" type="number" min="1" placeholder="Total marks" required><input name="questionIds" placeholder="Question IDs, comma separated" required><label><input name="published" type="checkbox"> Publish now</label><button>Create examination</button></form>
<div data-state class="state">Loading...</div><div id="list" class="feature-list"></div><section id="exam" hidden><h2 id="title"></h2><p id="timer" class="state"></p><form id="examForm"></form><button id="submit">Submit examination</button></section></section></main>
<script src="feature-common.js"></script><script>
const state=document.querySelector('[data-state]'),list=document.querySelector('#list'),exam=document.querySelector('#exam'),form=document.querySelector('#examForm'),teacherForm=document.querySelector('#teacherForm');let timerId;
if(JSON.parse(localStorage.getItem('profile')||'{}').role==='teacher')teacherForm.hidden=false;
async function load(){try{const data=await featureAuth.fetchJson('/api/mock-exams');state.hidden=true;list.innerHTML=data.length?data.map(x=>`<article class="feature-item learning-item"><div><b>${x.title}</b><p>${x.course} · ${x.durationMinutes} minutes · ${x.totalMarks} marks</p></div><button data-start="${x.id||x._id}">Start</button></article>`).join(''):'<div class="state">No published mock examinations are available.</div>'}catch(e){featureAuth.showError(e.message,load)}}
teacherForm.addEventListener('submit',async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(teacherForm));data.questionIds=data.questionIds.split(',').map(x=>x.trim()).filter(Boolean);data.published=teacherForm.published.checked;try{await featureAuth.fetchJson('/api/mock-exams',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});teacherForm.reset();load()}catch(e){alert(e.message)}});
list.addEventListener('click',async e=>{if(!e.target.dataset.start)return;try{const x=await featureAuth.fetchJson('/api/mock-exams/'+e.target.dataset.start);list.hidden=true;exam.hidden=false;document.querySelector('#title').textContent=x.title;form.innerHTML=x.questions.map((q,i)=>`<fieldset><legend>${i+1}. ${q.question}</legend>${q.options.map(o=>`<label class="option"><input type="radio" name="${q.questionId}" value="${o}"> ${o}</label>`).join('')}</fieldset>`).join('');exam.dataset.id=e.target.dataset.start;let remaining=Number(x.durationMinutes)*60;const tick=()=>{document.querySelector('#timer').textContent=`Time remaining: ${Math.floor(remaining/60)}:${String(remaining%60).padStart(2,'0')}`;if(remaining--<=0){clearInterval(timerId);window.autoSubmit=true;document.querySelector('#submit').click()}};tick();timerId=setInterval(tick,1000)}catch(err){featureAuth.showError(err.message,load)}});
document.querySelector('#submit').addEventListener('click',async()=>{if(!window.autoSubmit&&!confirm('Submit this examination now?'))return;window.autoSubmit=false;const answers={};form.querySelectorAll('input:checked').forEach(i=>answers[i.name]=i.value);try{const result=await featureAuth.fetchJson('/api/mock-exams/'+exam.dataset.id+'/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({answers})});clearInterval(timerId);exam.innerHTML=`<div class="state success">Submitted. Score: ${result.score}</div>`}catch(e){alert(e.message)}});load();
</script></body></html>
