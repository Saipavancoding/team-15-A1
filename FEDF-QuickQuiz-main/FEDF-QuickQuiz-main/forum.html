<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Discussion Forum - QuickQuiz</title><link rel="stylesheet" href="feature.css"><link rel="stylesheet" href="learning.css"></head><body><nav class="feature-nav"><a href="dashboard.html">Dashboard</a><a href="insights.html">Smart Insights</a><a href="planner.html">Study Planner</a><a href="flashcards.html">Flashcards</a><a href="mock-exams.html">Mock Exams</a><a class="active" href="forum.html">Discussion Forum</a><a href="certificates.html">Certificates</a><a href="saved.html">Saved Questions</a><a href="challenge.html">Daily Challenge</a><a href="review.html">Quiz Review</a><a href="leaderboard.html">Leaderboard</a></nav><main class="feature-main"><section class="feature-card"><h1>Discussion Forum</h1><form id="form" class="learning-form"><input name="course" placeholder="Course" required><input name="topic" placeholder="Topic"><input name="title" placeholder="Question title" required><textarea name="body" placeholder="Ask the community..." required></textarea><button>Post discussion</button></form><div class="toolbar"><input id="search" placeholder="Search discussions"><select id="sort"><option value="newest">Newest</option><option value="popular">Most discussed</option></select></div><div data-state class="state">Loading...</div><div id="list" class="feature-list"></div></section></main><script src="feature-common.js"></script><script>
const state=document.querySelector('[data-state]'),form=document.querySelector('#form'),list=document.querySelector('#list'),search=document.querySelector('#search'),sort=document.querySelector('#sort');async function load(){try{const data=await featureAuth.fetchJson('/api/discussions?search='+encodeURIComponent(search.value)+'&sort='+sort.value);state.hidden=true;list.innerHTML=data.length?data.map(x=>`<article class="feature-item"><b>${x.title}</b><p class="forum-body">${x.body}</p><span class="small">${x.course}${x.topic?' · '+x.topic:''} · ${x.likes||0} likes</span><div class="toolbar"><button data-like="${x.id||x._id}">Like</button><button data-reply="${x.id||x._id}">Reply</button><button data-report="${x.id||x._id}">Report</button></div></article>`).join(''):'<div class="state">No discussions match your search.</div>'}catch(e){featureAuth.showError(e.message,load)}}form.addEventListener('submit',async e=>{e.preventDefault();try{await featureAuth.fetchJson('/api/discussions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});form.reset();load()}catch(e){alert(e.message)}});search.addEventListener('input',load);sort.addEventListener('change',load);list.addEventListener('click',async e=>{try{if(e.target.dataset.like)await featureAuth.fetchJson('/api/discussions/'+e.target.dataset.like+'/like',{method:'POST'});if(e.target.dataset.reply){const body=prompt('Write your reply');if(body)await featureAuth.fetchJson('/api/discussions/'+e.target.dataset.reply+'/comments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({body})})}if(e.target.dataset.report){const reason=prompt('Reason for report');if(reason)await featureAuth.fetchJson('/api/discussions/'+e.target.dataset.report+'/report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reason})})}load()}catch(err){alert(err.message)}});load();</script></body></html>
