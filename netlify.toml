[build]
  command = "npm run build && npm install --prefix FEDF-Backend-main"
  publish = "FEDF-QuickQuiz-main/FEDF-QuickQuiz-main"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/"
  to = "/indexx.html"
  status = 200
