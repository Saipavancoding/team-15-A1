<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saved Questions - QuickQuiz</title><link rel="stylesheet" href="feature.css"></head><body>
<nav class="feature-nav"><a href="dashboard.html">Dashboard</a><a href="insights.html">Smart Insights</a><a class="active" href="saved.html">Saved Questions</a><a href="challenge.html">Daily Challenge</a><a href="review.html">Quiz Review</a><a href="leaderboard.html">Leaderboard</a></nav>
<main class="feature-main"><section class="feature-card"><h1>Saved Questions</h1><div id="filters" class="filters"><select id="courseFilter"><option value="">All courses</option></select><select id="topicFilter"><option value="">All topics</option></select><button type="button" id="practice">Practice saved questions</button></div><div data-state class="state">Loading saved questions...</div><div id="items" class="feature-list"></div></section></main>
<script src="feature-common.js"></script><script>
const state=document.querySelector('[data-state]'),items=document.getElementById('items'),courseFilter=document.getElementById('courseFilter'),topicFilter=document.getElementById('topicFilter');let saved=[];
function fillFilters(){const courses=[...new Set(saved.map(q=>q.course))].sort(),topics=[...new Set(saved.map(q=>q.topicId).filter(Boolean))].sort();courseFilter.innerHTML='<option value="">All courses</option>'+courses.map(v=>`<option>${v}</option>`).join('');topicFilter.innerHTML='<option value="">All topics</option>'+topics.map(v=>`<option>${v}</option>`).join('')}
function render(){const visible=saved.filter(q=>(!courseFilter.value||q.course===courseFilter.value)&&(!topicFilter.value||q.topicId===topicFilter.value));state.textContent=visible.length?`${visible.length} saved question(s)`:"You haven't saved any questions yet.";items.innerHTML=visible.map(q=>`<article class="feature-item"><b>${q.course} · ${q.topicId||'General'}</b><p>${q.question}</p><p class="muted">Difficulty: ${q.difficulty||'Unspecified'} · ${(q.options||[]).join(' · ')}</p><button type="button" data-remove="${q.questionId}">Remove</button></article>`).join('');items.querySelectorAll('[data-remove]').forEach(button=>button.addEventListener('click',()=>remove(button.dataset.remove)))}
async function load(){if(!featureAuth.requireAuth())return;state.className='state';state.textContent='Loading saved questions...';items.innerHTML='';try{saved=await featureAuth.fetchJson('/api/bookmarks');fillFilters();render()}catch(e){featureAuth.showError(e.message,load)}}
async function remove(id){try{await featureAuth.fetchJson('/api/bookmarks/'+encodeURIComponent(id),{method:'DELETE'});saved=saved.filter(q=>q.questionId!==id);fillFilters();render()}catch(e){featureAuth.showError(e.message,load)}}
courseFilter.addEventListener('change',render);topicFilter.addEventListener('change',render);document.getElementById('practice').addEventListener('click',()=>{if(saved.length)location.href='quizz.html?bookmarked=1';else state.textContent="Save at least one question before starting practice."});load();
</script></body></html>
